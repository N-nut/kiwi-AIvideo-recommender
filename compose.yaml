services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: kiwi
      POSTGRES_USER: kiwi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiwi-local-development}
    volumes: ["kiwi-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwi -d kiwi"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kiwi:${POSTGRES_PASSWORD:-kiwi-local-development}@db:5432/kiwi
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on: {backend: {condition: service_healthy}}
volumes:
  kiwi-db:
