[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-rag"
version = "1.0.0"
description = "Evidence-grounded comic animation recommendations"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "httpx>=0.28,<1",
  "langchain-openai>=1,<2", "langchain-core>=1,<2",
  "pwdlib[argon2]>=0.3,<1",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.setuptools.packages.find]
include = ["kiwi*"]
[tool.setuptools.package-data]
kiwi = ["*.mjs"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
